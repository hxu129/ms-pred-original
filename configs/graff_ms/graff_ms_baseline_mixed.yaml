launcher_args: {experiment_name: graff_ms_baseline_mixed_train,
  script_name: "src/ms_pred/graff_ms/train.py",
  slurm_script: launcher_scripts/generic_slurm.sh, 
  launch_method: local,
  visible_devices: [0,3],
}
universal_args:
  _slurm_args:
  - {_num_gpu: 2, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G, 
    nodelist: 'node[1236]', time: '1-18:00:00'}
  debug: [false]
  gpu: [true]
  num-gpus: [2]
  strategy: [ddp_find_unused_parameters_true]  # Required: set_layers=0 causes unused set_transformer params

  seed: [1]
  num-workers: [16]  # 减少到8，避免OOM (2 GPU × 8 = 16 workers total)
  batch-size: [32]
  max-epochs: [400]

  dataset-name: [mixed_canopus_msg]
  split-name: [split_1.tsv] 

  learning-rate: [0.00018]
  lr-decay-rate: [0.92]
  num-bins: [15000] 
  loss-fn: [cosine]

  dropout: [0.3]
  hidden-size: [512]
  layers: [6]
  weight-decay: [1e-6]
  pe-embed-k: [11]
  pool-op: [avg]
  set-layers: [0]
  use-reverse: [false]

  form-dir-name: ['mixed_subformulae']
  embed-adduct: [true]
  mpnn-type: [GGNN]
  num-fixed-forms: [5000]
  lazy-loading: [true]
  cache-size: [512]
  validate-on-init: [true]

iterative_args:
  -  split-name: [split_1.tsv]
     save-dir: [mixed_rnd2]
     seed: [2]

